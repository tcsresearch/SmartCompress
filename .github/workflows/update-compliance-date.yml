name: Update ShellCheck Compliance Date

on:
  workflow_run:
    workflows: ["ShellCheck_njs24", "ShellCheck .bfunc files"]
    types:
      - completed
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

            - name: Verify Both Workflows Passed
        uses: actions/github-script@v7
        id: status-check
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Safe fallback: use the workflow_run branch, or default to main/master if run manually
            const branch = context.payload.workflow_run 
              ? context.payload.workflow_run.head_branch 
              : context.ref.replace('refs/heads/', '');

            console.log(`Checking status for branch: ${branch}`);

            const run1 = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ShellCheck_njs24.yml', branch, per_page: 1
            });
            const run2 = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ShellCheck_njs24-bfuncOnly.yml', branch, per_page: 1
            });

            // Safely fetch conclusions, defaulting to 'failed' if no runs exist yet
            const status1 = run1.data.workflow_runs?.[0]?.conclusion || 'no_runs_found';
            const status2 = run2.data.workflow_runs?.[0]?.conclusion || 'no_runs_found';

            console.log(`ShellCheck_njs24 conclusion: ${status1}`);
            console.log(`ShellCheck_njs24-bfuncOnly conclusion: ${status2}`);

            if (status1 === 'success' && status2 === 'success') {
              core.setOutput('passed', 'true');
            } else {
              core.setOutput('passed', 'false');
            }

      - name: Update README Date
        if: steps.status-check.outputs.passed == 'true'
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%d')
          NEW_TEXT="**Shellcheck Date Of Compliance:** $CURRENT_DATE"
          
          # Use perl to replace everything between our two anchor comment tags
          perl -i -0777 -pe "s/(<!-- SHELLCHECK_COMPLIANCE_START -->).*?(<!-- SHELLCHECK_COMPLIANCE_END -->)/\$1\n$NEW_TEXT\n\$2/s" README.md

      - name: Commit and Push Changes
        if: steps.status-check.outputs.passed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "chore: update shellcheck date of compliance [$CURRENT_DATE]" || echo "No changes to commit"
          git push
